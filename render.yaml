services:
  - type: web
    name: wati-incoming-webhook
    env: node
    branch: main
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: WATI_API_ENDPOINT
        value: https://api.wati.io
      - key: ADMIN_SECRET
        sync: false
      - key: WATI_API_TOKEN
        sync: false
