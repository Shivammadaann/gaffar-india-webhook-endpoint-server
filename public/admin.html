<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WATI Webhook Admin</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f5f8ff; color: #0f172a; }
    header { background: #1e293b; color: #fff; padding: 18px 24px; }
    h1 { margin: 0; font-size: 1.4rem; }
    .container { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); padding: 20px; margin-bottom: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; }
    .row > * { flex: 1 1 240px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, button, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; transition: background .2s ease; }
    button:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; color: #334155; }
    .badge { display: inline-flex; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
    .badge.success { background: #dcfce7; color: #166534; }
    .badge.error { background: #fee2e2; color: #991b1b; }
    .badge.pending { background: #e0f2fe; color: #0369a1; }
    .details { max-height: 160px; overflow: auto; white-space: pre-wrap; background: #f8fafc; padding: 12px; border-radius: 10px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>WATI Webhook Relay Admin</h1>
  </header>
  <div class="container">
    <div class="card">
      <h2>Live events</h2>
      <p>Incoming events are displayed in real time.</p>
      <div class="row">
        <div>
          <label for="forwardUrl">Forward URL</label>
          <input id="forwardUrl" placeholder="https://example.com/receive" />
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="saveForward">Save forwarding URL</button>
        </div>
      </div>
      <div class="row" style="margin-top: 12px;">
        <div style="flex: 1 1 100%;">
          <label for="adminSecret">Admin Secret</label>
          <input id="adminSecret" placeholder="X-Admin-Secret header value" />
        </div>
      </div>
      <div id="statusMessage" style="margin-top: 16px;"></div>
    </div>

    <div class="card">
      <h2>Register WATI webhook endpoint</h2>
      <div class="row">
        <div>
          <label for="phoneNumber">Phone number</label>
          <input id="phoneNumber" placeholder="1650-937-9611" />
        </div>
        <div>
          <label for="status">Status</label>
          <select id="status">
            <option value="0">0 - Enabled</option>
            <option value="1">1 - Disabled</option>
            <option value="2">2 - Defective</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top: 12px;">
        <div>
          <label for="watiUrl">Webhook destination URL</label>
          <input id="watiUrl" placeholder="https://watiwebhooks.gaffarindia.in/webhook" />
        </div>
        <div>
          <label for="eventTypes">Event types</label>
          <input id="eventTypes" placeholder="message,newContactMessageReceived" />
        </div>
      </div>
      <div style="margin-top: 12px;">
        <button id="registerWebhook">Register webhook in WATI</button>
      </div>
      <div id="watiStatusMessage" style="margin-top: 16px;"></div>
    </div>

    <div class="card">
      <h2>Latest events</h2>
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Source</th>
            <th>Event</th>
            <th>Forward</th>
          </tr>
        </thead>
        <tbody id="eventsTable"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Selected payload</h2>
      <div class="details" id="selectedDetails">No event selected yet.</div>
    </div>
  </div>

  <script>
    const eventsTable = document.getElementById('eventsTable');
    const selectedDetails = document.getElementById('selectedDetails');
    const forwardUrlInput = document.getElementById('forwardUrl');
    const saveButton = document.getElementById('saveForward');
    const statusMessage = document.getElementById('statusMessage');
    const adminSecretInput = document.getElementById('adminSecret');
    const phoneInput = document.getElementById('phoneNumber');
    const statusInput = document.getElementById('status');
    const watiUrlInput = document.getElementById('watiUrl');
    const eventTypesInput = document.getElementById('eventTypes');
    const registerButton = document.getElementById('registerWebhook');
    const watiStatusMessage = document.getElementById('watiStatusMessage');

    function displayMessage(text, isError = false) {
      statusMessage.textContent = text;
      statusMessage.style.color = isError ? '#b91c1c' : '#0f766e';
    }

    function displayWatiMessage(text, isError = false) {
      watiStatusMessage.textContent = text;
      watiStatusMessage.style.color = isError ? '#b91c1c' : '#0f766e';
    }

    function getAdminHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      const secret = adminSecretInput.value.trim();
      if (secret) {
        headers['X-Admin-Secret'] = secret;
      }
      return headers;
    }

    function displayWatiMessage(text, isError = false) {
      watiStatusMessage.textContent = text;
      watiStatusMessage.style.color = isError ? '#b91c1c' : '#0f766e';
    }

    function renderEvent(event) {
      const tr = document.createElement('tr');
      const timestamp = new Date(event.receivedAt).toLocaleString();
      const source = event.sourceIp || 'unknown';
      const eventType = event.headers['x-wati-event'] || (typeof event.body === 'object' ? 'JSON' : 'Raw');
      const status = event.forwarded ? 'success' : 'pending';

      tr.innerHTML = `
        <td>${timestamp}</td>
        <td>${source}</td>
        <td>${eventType}</td>
        <td><span class="badge ${status}">${event.forwarded ? 'Forwarded' : 'Pending'}</span></td>
      `;
      tr.addEventListener('click', () => {
        selectedDetails.textContent = JSON.stringify(event, null, 2);
      });
      return tr;
    }

    async function loadConfig() {
      const response = await fetch('/api/config');
      const config = await response.json();
      forwardUrlInput.value = config.forwardUrl || '';
    }

    async function loadEvents() {
      const response = await fetch('/api/events?limit=40');
      const json = await response.json();
      eventsTable.innerHTML = '';
      json.events.forEach((event) => eventsTable.appendChild(renderEvent(event)));
      if (json.events.length > 0) {
        selectedDetails.textContent = JSON.stringify(json.events[0], null, 2);
      }
    }

    async function saveForwardUrl() {
      const url = forwardUrlInput.value.trim();
      const response = await fetch('/api/forward', {
        method: 'POST',
        headers: getAdminHeaders(),
        body: JSON.stringify({ forwardUrl: url }),
      });
      if (!response.ok) {
        const errorBody = await response.json().catch(() => ({}));
        displayMessage(errorBody.error || 'Unable to save forward URL', true);
        return;
      }
      displayMessage('Forward URL saved successfully.');
    }

    async function registerWatiWebhook() {
      const phoneNumber = phoneInput.value.trim();
      const statusValue = statusInput.value;
      const url = watiUrlInput.value.trim();
      const eventTypes = eventTypesInput.value.split(',').map((item) => item.trim()).filter(Boolean);

      if (!phoneNumber || !url || eventTypes.length === 0) {
        displayWatiMessage('Phone number, destination URL, and event types are required.', true);
        return;
      }

      const response = await fetch('/api/wati/register', {
        method: 'POST',
        headers: getAdminHeaders(),
        body: JSON.stringify([
          {
            phoneNumber,
            status: Number(statusValue),
            url,
            eventTypes,
          },
        ]),
      });

      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        displayWatiMessage(body.error || 'Failed to register webhook with WATI.', true);
        return;
      }

      displayWatiMessage('WATI webhook endpoint registered successfully.', false);
    }

    saveButton.addEventListener('click', saveForwardUrl);
    registerButton.addEventListener('click', registerWatiWebhook);

    async function initialize() {
      await loadConfig();
      await loadEvents();
      const source = new EventSource('/events/stream');
      source.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const row = renderEvent(data);
          eventsTable.prepend(row);
          while (eventsTable.children.length > 40) {
            eventsTable.removeChild(eventsTable.lastChild);
          }
        } catch (error) {
          console.warn('Unable to parse stream event', error);
        }
      };
      source.onerror = () => {
        displayMessage('Realtime connection lost. Refresh to restore.', true);
      };
    }

    initialize().catch((error) => {
      displayMessage('Failed to initialize admin UI: ' + error.message, true);
    });
  </script>
</body>
</html>
